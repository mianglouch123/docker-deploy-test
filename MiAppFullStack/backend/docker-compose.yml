services:
  frontend:
    build:
      context: ../../ANGULAR-COURSE/angular-learning
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    environment:
      - API_URL=/api
    depends_on:
      - backend
   
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__sqlstrings=Server=database;Database=CursoSql;User Id=sa;Password=TuPasswordSeguro123!;Encrypt=False;TrustServerCertificate=True;
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TuPasswordSeguro123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    healthcheck:
     test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TuPasswordSeguro123!' -C -Q 'SELECT 1' || exit 1"]
     interval: 10s
     retries: 10
     start_period: 40s
     timeout: 5s

networks:
 red-fullstack:
    driver: bridge

  

volumes:
  sqlserverdata: