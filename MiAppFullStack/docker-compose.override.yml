services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      - "4200:4200"
    environment:
      - API_URL=/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
    ports: !override
      - "5000:5000"
    environment:
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__sqlstrings=Server=database;Database=CursoSql;User Id=sa;Password=TuPasswordSeguro123!;Encrypt=False;TrustServerCertificate=True;
    depends_on:
      database:
        condition: service_healthy

  database:
    environment:
      - MSSQL_SA_PASSWORD=TuPasswordSeguro123!